; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:az-delivery-devkit-v4]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The default partition table is kept on purpose: an update over WiFi cannot change the table
; on a device that is already installed. If the firmware outgrows it, add
;   board_build.partitions = min_spiffs.csv
; and flash once over USB.

; Upload over WiFi. For the first flash of this firmware over USB, comment these two lines out.
upload_protocol = espota
upload_port = 192.168.0.13

; TODO: pin ProjectUtils to #v2.1.0 once its page-password branch is merged and tagged
lib_deps =
    https://github.com/Cameloah/ProjectUtils-esp32.git#feature/page-password
    ; 3.7.6 is no longer in the PlatformIO registry, so it comes from the git tag
    https://github.com/FastLED/FastLED.git#3.7.6
    someweisguy/esp_dmx@^4.1.0
    knolleary/PubSubClient@^2.8
